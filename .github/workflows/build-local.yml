name: Build local-mods

on:
  push:
    branches: [local-mods]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (glibc)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (stealth)
        run: cargo build --release -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-x86_64
          path: target/release/obscura
          if-no-files-found: error

  build-android-aarch64:
    name: Termux aarch64 (zigbuild cross)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust + aarch64 gnu target + zigbuild
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-gnu
          pip3 install --upgrade --quiet cargo-zigbuild
          cargo zigbuild --help > /dev/null && echo zigbuild-ok
      - name: Install aarch64 libc headers (bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-dev-arm64-cross
      - name: Build (stealth, aarch64 gnu via zig)
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-gnu -I/usr/aarch64-linux-gnu/include"
          # btls-sys 的 -l static 在交叉链接时不展开:显式按绝对路径链 .a
          export OBSCURA_LINK_BORINGSSL_EXPLICIT=1
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 -p obscura-cli --features stealth
      - name: Diagnose btls symbols (on failure)
        if: failure()
        run: |
          OUT=$(find target/aarch64-unknown-linux-gnu/release/build -maxdepth 3 -type d -name out -path "*btls*" | head -1)
          echo "OUT=$OUT"
          find "$OUT" -name "libcrypto.a" -o -name "libssl.a" 2>/dev/null
          LIB=$(find "$OUT" -name "libcrypto.a" | head -1)
          if [ -n "$LIB" ]; then
            echo "--- unprefixed SSL_read occurrences:"
            nm "$LIB" 2>/dev/null | grep -c " SSL_read" || true
            echo "--- prefixed SSL_read occurrences:"
            nm "$LIB" 2>/dev/null | grep -c "build_script_main_SSL_read" || true
            echo "--- redefine_syms.txt head:"
            head -3 "$OUT/redefine_syms.txt" 2>/dev/null || echo "NO redefine_syms.txt"
          else
            echo "NO libcrypto.a found in btls out dir"
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-termux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/obscura
          if-no-files-found: error
