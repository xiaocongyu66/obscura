name: Build local-mods

on:
  push:
    branches: [local-mods]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (glibc)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (stealth)
        run: cargo build --release -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-x86_64
          path: target/release/obscura
          if-no-files-found: error

  build-android-aarch64:
    name: Termux aarch64 (zigbuild cross)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust + aarch64 gnu target + zigbuild
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-gnu
          pip3 install --quiet cargo-zigbuild==0.19.7 || pip3 install cargo-zigbuild
          cargo zigbuild --version
      - name: Build (stealth, aarch64 gnu via zig)
        run: |
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-termux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/obscura
          if-no-files-found: error
