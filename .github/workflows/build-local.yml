name: Build local-mods

on:
  push:
    branches: [local-mods]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (glibc)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (stealth)
        run: cargo build --release -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-x86_64
          path: target/release/obscura
          if-no-files-found: error

  build-android-aarch64:
    name: Termux aarch64 (zigbuild cross)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust + aarch64 gnu target + zigbuild
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-unknown-linux-gnu
          pip3 install --quiet cargo-zigbuild==0.19.7 || pip3 install cargo-zigbuild
          python3 -m ziglang version || true
      - name: Install aarch64 libc headers (bindgen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libc6-dev-arm64-cross
      - name: Build (stealth, aarch64 gnu via zig)
        run: |
          export BINDGEN_EXTRA_CLANG_ARGS="--target=aarch64-linux-gnu -I/usr/aarch64-linux-gnu/include"
          # zig lld 不认 rustc 默认加的 A53 erratum 链接参数
          export RUSTFLAGS="-C link-arg=-Wl,--no-fix-cortex-a53-843419"
          cargo zigbuild --release --target aarch64-unknown-linux-gnu.2.31 -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-termux-aarch64
          path: target/aarch64-unknown-linux-gnu/release/obscura
          if-no-files-found: error
