name: Build local-mods

on:
  push:
    branches: [local-mods]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build (stealth)
        run: cargo build --release -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-x86_64
          path: target/release/obscura
          if-no-files-found: error

  build-linux-arm64:
    name: Linux arm64 (native)
    # 必须原生 arm64 runner:build.rs 交叉编译时找不到 cross-mksnapshot 会回退
    # 到 host(x86_64)V8 snapshot,arm64 设备上加载直接 SIGSEGV。本机构建时
    # host == target,快照架构正确,也不需要 zigbuild/btls-sys 两 pass hack。
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libclang-dev pkg-config
      - name: Build (stealth)
        run: cargo build --release -p obscura-cli --features stealth
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obscura-linux-arm64
          path: target/release/obscura
          if-no-files-found: error
