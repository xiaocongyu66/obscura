name: mozjs-compile-probe

on:
  workflow_dispatch: {}
  push:
    branches: [local-mods, servo-merge]
    paths: ['.github/workflows/mozjs-probe.yml', 'servo/**', 'Cargo.toml', 'crates/obscura-embedder/**']

jobs:
  workspace-script-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang mold cmake ninja-build yasm autoconf2.13 libclang-dev pkg-config python3-pip libfreetype-dev libfontconfig1-dev libharfbuzz-dev libssl-dev libasound2-dev libudev-dev libx11-dev libgbm-dev libegl1-mesa-dev
      - name: cargo check servo-script (vendored workspace)
        run: cargo check -p servo-script --no-default-features --message-format=short 2>&1 | tail -30
      - name: cargo check obscura-embedder
        run: cargo check -p obscura-embedder --message-format=short 2>&1 | tail -120
      - name: cargo check obscura-cli (self-engine removal)
        run: cargo check -p obscura-cli --message-format=short 2>&1 | tail -120
      - name: serve probe (json/version + flatten CDP over WS)
        run: |
          cargo build -p obscura-cli 2>&1 | tail -3
          (RUST_LOG=warn ./target/debug/obscura serve --port 9277 --proxy http://127.0.0.1:1 >/tmp/serve.log 2>&1 &)
          for i in $(seq 1 30); do curl -s --max-time 2 http://127.0.0.1:9277/json/version | grep -q obscura && break; sleep 1; done
          curl -s http://127.0.0.1:9277/json/version
          curl -s -o /dev/null -w " /json/list=%{http_code}\n" http://127.0.0.1:9277/json/list
          python3 - <<'PY'
          import base64, json, os, socket, struct
          s = socket.create_connection(("127.0.0.1", 9277), timeout=20)
          key = base64.b64encode(os.urandom(16)).decode()
          s.sendall((f"GET /devtools/browser HTTP/1.1\r\nHost: 127.0.0.1:9277\r\nUpgrade: websocket\r\nConnection: Upgrade\r\nSec-WebSocket-Key: {key}\r\nSec-WebSocket-Version: 13\r\n\r\n").encode())
          hdr = b""
          while b"\r\n\r\n" not in hdr: hdr += s.recv(4096)
          assert b"101" in hdr.split(b"\r\n")[0], hdr[:200]
          def send(method, params, mid):
              payload = json.dumps({"id": mid, "method": method, "params": params}).encode()
              mask = os.urandom(4)
              hdr2 = bytes([0x81])
              n = len(payload)
              hdr2 += bytes([0x80 | (7 if n < 126 else 0)] + ([] if n < 126 else [126, n >> 8, n & 0xFF]))
              s.sendall(hdr2 + mask + bytes(b ^ mask[i % 4] for i, b in enumerate(payload)))
          def recv(mid):
              while True:
                  b1, b2 = struct.unpack("BB", s.recv(2))
                  ln = b2 & 0x7F
                  if ln == 126: ln = struct.unpack(">H", s.recv(2))[0]
                  elif ln == 127: ln = struct.unpack(">Q", s.recv(8))[0]
                  data = b""
                  while len(data) < ln: data += s.recv(ln - len(data))
                  msg = json.loads(data)
                  if msg.get("id") == mid: return msg
          send("Target.createTarget", {"url": "about:blank"}, 1); print("createTarget:", recv(1)["result"]["targetId"][:8])
          send("Target.attachToTarget", {"targetId": "x", "flatten": True}, 2); print("attach sessionId:", recv(2)["result"]["sessionId"])
          send("Runtime.evaluate", {"expression": "navigator.userAgent", "returnByValue": True}, 3)
          ua = recv(3)["result"]["result"]["value"]
          print("SERVE-PROBE OK — flatten CDP live, UA:", ua[:60])
          PY
          pkill -f "obscura serve --port 9277" || true
      - name: upload obscura binary (for local e2e on arm64)
        uses: actions/upload-artifact@v4
        with:
          name: obscura-servo-arm64
          path: target/debug/obscura
          if-no-files-found: error
      - name: runtime smoke (boot + navigate + screenshot)
        run: |
          cargo build -p obscura-embedder --bin smoke 2>&1 | tail -5
          RUST_LOG=info ./target/debug/smoke
      - name: bridge smoke (evaluate + input pipeline)
        run: |
          cargo build -p obscura-embedder --bin bridge_smoke 2>&1 | tail -5
          RUST_LOG=info ./target/debug/bridge_smoke
      - name: search smoke (bing extraction)
        run: |
          cargo build -p obscura-embedder --bin search_smoke 2>&1 | tail -5
          RUST_LOG=warn ./target/debug/search_smoke
      - name: CF demo smoke (turnstile widget pipeline)
        run: |
          cargo build -p obscura-embedder --bin cf_demo 2>&1 | tail -5
          RUST_LOG=warn ./target/debug/cf_demo
      - name: wpt.live connectivity probe (GET + kernel ladder)
        run: |
          getent hosts wpt.live || echo "DNS-FAIL wpt.live"
          for u in "https://wpt.live/" "https://example.com/" \
                   "/dom/collections/HTMLCollection-live.html" \
                   "/dom/nodes/Element-insertAdjacentElement.html" \
                   "/dom/nodes/Element-closest.html" \
                   "/dom/nodes/createElementNS.html" \
                   "/dom/nodes/Node-cloneNode.html" \
                   "/dom/events/Event-dispatch-click.html" \
                   "/mutation-observer/MutationObserver-childList.html" \
                   "/dom/nodes/ChildNode-after.html"; do
            case "$u" in /*) full="https://wpt.live$u";; *) full="$u";; esac
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 25 "$full") || code="FAIL"
            echo "curl GET $full -> $code"
          done
      - name: WPT smoke (local checkout — CF tarpits wpt.live from runners)
        run: |
          cargo build -p obscura-embedder --bin wpt_smoke 2>&1 | tail -5
          git clone --depth 1 --filter=blob:none --sparse https://github.com/web-platform-tests/wpt.git /tmp/wpt
          cd /tmp/wpt && git sparse-checkout set resources dom mutation-observer events selectors && cd /
          (cd /tmp/wpt && nohup python3 -m http.server 8999 >/tmp/wpt-server.log 2>&1 &) ; sleep 2
          curl -s -o /dev/null -w "local wpt server: %{http_code}\n" "http://127.0.0.1:8999/dom/nodes/Element-closest.html"
          cd "$GITHUB_WORKSPACE"
          OBSCURA_WPT_BASE=http://127.0.0.1:8999 RUST_LOG=info ./target/debug/wpt_smoke
      - name: h1 ladder probe (does HTTP/1.1 sidestep the wpt.live stall?)
        run: |
          OBSCURA_ALPN=http1 OBSCURA_WPT_LADDER_ONLY=1 RUST_LOG=debug ./target/debug/wpt_smoke 2>&1 | grep -E "\[wpt\]|chrome-connect|http-loader" | head -40

  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install SpiderMonkey build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang mold cmake ninja-build yasm autoconf2.13 libclang-dev pkg-config python3-pip libfreetype-dev libfontconfig1-dev libharfbuzz-dev libssl-dev libasound2-dev libudev-dev libx11-dev libgbm-dev libegl1-mesa-dev
          clang --version | head -1

      - name: mozjs standalone compile probe
        run: |
          cargo new --bin probe 2>/dev/null || true
          cd probe
          cat > Cargo.toml <<'TOML'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          mozjs = { version = "=0.24.0", default-features = false, features = ["intl", "libz-sys"] }
          TOML
          echo 'fn main() { println!("mozjs link ok"); }' > src/main.rs
          cargo build --release 2>&1 | tail -25
          ./target/release/probe

      - name: servo script crate check probe
        run: |
          git clone --depth 1 --branch main https://github.com/servo/servo.git servo-src 2>&1 | tail -1 || true
          # 若 sparse 已有本地拷贝更好——CI 里直接完整 clone
          cd servo-src
          rustc --version
          # 只验证 script 组依赖图能否解析 + mozjs-sys 能否在 CI 产出
          cargo check -p servo-script 2>&1 | tail -30
