name: mozjs-compile-probe

on:
  workflow_dispatch: {}
  push:
    branches: [local-mods, servo-merge]
    paths: ['.github/workflows/mozjs-probe.yml', 'servo/**', 'Cargo.toml', 'crates/obscura-embedder/**']

jobs:
  workspace-script-check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang mold cmake ninja-build yasm autoconf2.13 libclang-dev pkg-config python3-pip libfreetype-dev libfontconfig1-dev libharfbuzz-dev libssl-dev libasound2-dev libudev-dev libx11-dev libgbm-dev libegl1-mesa-dev
      - name: cargo check servo-script (vendored workspace)
        run: cargo check -p servo-script --no-default-features 2>&1 | tail -30
      - name: cargo check obscura-embedder
        run: cargo check -p obscura-embedder 2>&1 | tail -30
      - name: runtime smoke (boot + navigate + screenshot)
        run: |
          cargo build -p obscura-embedder --bin smoke 2>&1 | tail -5
          RUST_LOG=info ./target/debug/smoke
      - name: bridge smoke (evaluate + input pipeline)
        run: |
          cargo build -p obscura-embedder --bin bridge_smoke 2>&1 | tail -5
          RUST_LOG=info ./target/debug/bridge_smoke

  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - name: Install SpiderMonkey build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq llvm clang mold cmake ninja-build yasm autoconf2.13 libclang-dev pkg-config python3-pip libfreetype-dev libfontconfig1-dev libharfbuzz-dev libssl-dev libasound2-dev libudev-dev libx11-dev libgbm-dev libegl1-mesa-dev
          clang --version | head -1

      - name: mozjs standalone compile probe
        run: |
          cargo new --bin probe 2>/dev/null || true
          cd probe
          cat > Cargo.toml <<'TOML'
          [package]
          name = "probe"
          version = "0.1.0"
          edition = "2021"
          [dependencies]
          mozjs = { version = "=0.24.0", default-features = false, features = ["intl", "libz-sys"] }
          TOML
          echo 'fn main() { println!("mozjs link ok"); }' > src/main.rs
          cargo build --release 2>&1 | tail -25
          ./target/release/probe

      - name: servo script crate check probe
        run: |
          git clone --depth 1 --branch main https://github.com/servo/servo.git servo-src 2>&1 | tail -1 || true
          # 若 sparse 已有本地拷贝更好——CI 里直接完整 clone
          cd servo-src
          rustc --version
          # 只验证 script 组依赖图能否解析 + mozjs-sys 能否在 CI 产出
          cargo check -p servo-script 2>&1 | tail -30
