# Parallel build tuning (local + CI shared).
# mold cuts link time ~5-10x on incremental builds; falls back to system
# linker where mold isn't installed (CI installs it explicitly).
[target.aarch64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--ld-path=mold", "-C", "link-arg=-Wl,--no-rosegment"]

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=--ld-path=mold", "-C", "link-arg=-Wl,--no-rosegment"]

[profile.dev]
# Full debuginfo dominates incremental link time and disk; line tables are
# enough for backtraces.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
lto = "thin"
codegen-units = 16
debug = "line-tables-only"

[net]
git-fetch-with-cli = true
